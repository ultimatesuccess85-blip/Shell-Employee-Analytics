<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shell People Analytics</title>
    <meta
      name="description"
      content="Workforce intelligence dashboard for Shell UK HR leadership tracking headcount, attrition, compensation, and retention risk."
    />
    <meta property="og:title" content="Shell People Analytics" />
    <meta
      property="og:description"
      content="Workforce intelligence dashboard for Shell UK HR leadership tracking headcount, attrition, compensation, and retention risk."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('shell-pa-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F7F5] text-[#0D0D0F] dark:bg-[#0B0B0D] dark:text-[#F5F5F4] antialiased selection:bg-[#FFC800] selection:text-[#0D0D0F]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
